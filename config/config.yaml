# Minimal placeholder config. Kamyar owns the real one; keep fields
# compatible so his version can replace this file verbatim.

seed_base: 20261116          # per-call seed = seed_base + offset (see config.py)
temperature: 0.7
runs_per_cell: 5             # runs per (market, condition, model)
decoy_min_distance: 20       # points away from the real price

models:
  - llama3.2:3b
  - llama3.1:8b
  - qwen2.5:3b
  - qwen2.5:7b

paths:
  markets_csv: data/markets.csv
  dev_split: data/dev_ids.txt       # one market_id per line
  test_split: data/test_ids.txt
  results_dir: results
  fixtures_markets: fixtures/dev_markets.csv

ollama:
  host: http://localhost:11434
  request_timeout_s: 120
